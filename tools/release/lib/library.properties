sentence=Run a Mistral Workflows / Temporal activity worker on an ESP32.
paragraph=The ESP32 registers as a worker, long-polls for activity tasks over gRPC/TLS (HTTP/2 via bundled nghttp2, protobuf via bundled nanopb), runs your handler, and reports the result. No cloud SDK, no host in the loop. Requires the ESP32 Arduino core 3.x (Arduino IDE: esp32 boards package 3.0.0 or newer).
