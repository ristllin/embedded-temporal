; firmware — ESP32-S3 (N16R8) app: the device as a Mistral Workflows worker.
; Modeled on a field-proven ESP32-S3 project configuration.
;
;   Host unit tests:  pio test -e native        (portable code only, no hardware)
;   Firmware:         pio run -e esp32s3 -t upload
;
; The platform pin is a toolchain validated on this hardware — keep it pinned.

[platformio]
default_envs = native

; ---- Host-side tests: only portable code compiles here (no Arduino) ----
; The device durable store + main are Arduino-linked; the portable seams they
; implement come from core/codec/contracts, host-tested in THEIR repos.
[env:native]
platform = native
test_framework = unity
; -I paths let the host test reach the PORTABLE durable-store core (src/) and the
; frozen contract types (../contracts) without pulling in any Arduino code.
build_flags =
    -std=gnu++17
    -DMWF_NATIVE
    -I src
    -I ../contracts/include
build_src_filter = -<*>

[s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/git_version.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Production is quiet: level 1 = ERROR only over USB-CDC (INFO would stream
    ; scheduler_url / namespace / workflow ids / heap / WiFi state continuously to
    ; anyone with a serial cable). Use env:esp32s3_debug (or the cookbook demo env)
    ; for the verbose whoami/register/poll/"completed" bring-up trail.
    -DCORE_DEBUG_LEVEL=1
    ; The on-device workflow REPLAY (ReplayEngine/WorkflowSpec/History) is written
    ; against nlohmann's json API — the ONLY device-portable path without a risky
    ; ArduinoJson rewrite that couldn't be re-verified against the 63 host tests.
    ; ESP32-S3 Arduino has CONFIG_COMPILER_CXX_EXCEPTIONS=y, so nlohmann builds
    ; as-is (identical semantics to the host build). Vendored under vendor/nlohmann.
    -DMWF_JSON_NLOHMANN
    -Ivendor
lib_deps =
    symlink://../contracts
    symlink://../core
    symlink://../codec
    symlink://../transport
    symlink://../proto

[env:esp32s3]
extends = s3
build_src_filter = +<*>

; Bring-up / demo: the verbose INFO trail (whoami / register / round-robin poll /
; "workflow completed"). Not for production.
[env:esp32s3_debug]
extends = s3
build_src_filter = +<*>
build_flags =
    ${s3.build_flags}
    -DCORE_DEBUG_LEVEL=3

; Cookbook 04 — durable human-in-the-loop. Same firmware, MWF_COOKBOOK=4 selects
; the mwf_device_hitl workflow (pauses on a signal) + the BOOT-button signal path.
; Ships verbose so the "WAITING for button" / "signal sent" trail is visible.
;   pio run -e esp32s3_cb4 -t upload
[env:esp32s3_cb4]
extends = s3
build_src_filter = +<*>
build_flags =
    ${s3.build_flags}
    -DMWF_COOKBOOK=4
    -DCORE_DEBUG_LEVEL=3
